[project]
name = "shopmind-ai-service"
version = "0.1.0"
description = "AI microservice for intelligent e-commerce platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
   "fastapi",
   "uvicorn[standard]",
   "sqlalchemy[asyncio]",
   "asyncpg",
   "psycopg2-binary",
   "pymilvus",
   "rocketmq-client-python",
   "langchain",
   "langchain-openai",
   "langchain-community",
   "langgraph",
   "llama-index",
   "llama-index-vector-stores-milvus",
   "openai",
   "pydantic",
   "pydantic-settings",
   "python-dotenv",
   "httpx",
   "python-json-logger",
   "tenacity",
   "nacos-sdk-python",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "black>=24.10.0",
    "ruff>=0.8.4",
]
