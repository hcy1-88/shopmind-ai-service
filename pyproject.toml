[project]
name = "shopmind-ai-service"
version = "0.1.0"
description = "AI microservice for intelligent e-commerce platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
   "fastapi",
   "uvicorn[standard]",
   "pymilvus",
   "langchain",
   "langchain-openai",
   "langchain-community",
   "langgraph",
   "llama-index",
   "llama-index-vector-stores-milvus",
   "openai",
   "pydantic",
   "pydantic-settings",
   "python-dotenv",
   "httpx",
   "python-json-logger",
   "tenacity",
   "nacos-sdk-python",
   "dashscope>=1.25.5",
   "redis>=7.1.0",
   "llama-index-storage-docstore-postgres>=0.4.1",
   "llama-index-storage-index-store-postgres>=0.5.1",
   "python-multipart>=0.0.21",
   "llama-index-embeddings-dashscope>=0.4.1",
   "langchain-tavily>=0.2.17",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "black>=24.10.0",
    "ruff>=0.8.4",
]

[tool.setuptools]
# src 布局配置：将 src 目录下的包作为顶级包
# 这样 src/app 可以通过 "from app import ..." 导入
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
