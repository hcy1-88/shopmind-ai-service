# Nacos 配置示例
# Data ID: shopmind-ai-service.yaml
# Group: DEFAULT_GROUP
# 配置格式: YAML

# Milvus 向量数据库配置
milvus:
  host: localhost
  port: 19530
  token: root:Milvus
  # 不存在，则创建
  db_name: shopmind_dev


embedding:
  # 使用 阿里云百炼平台 的嵌入模型，用官方的 dashscope
  provider: bailian
  bailian:
    text_model: text-embedding-v4
    text_model_dim: 1024
    vision_model: tongyi-embedding-vision-plus
    vision_model_dim: 1152
    api_key: sk-af3f441d4a1343bfabe5a6395ecacc91


# LLM 大语言模型配置
llm:
  # 提供商: openai, tongyi (通义千问)
  provider: openai

  # OpenAI 配置
  openai:
    api_key: sk-UWy0ENwJ3j5LCTgn47LZjv6wTv9TQ51vppqxWjTDHXS3lQSq
    api_base: https://api.openai-proxy.org/v1
    model: gpt-4o-mini  # 文本生成模型
    vision_model: gpt-4o  # 视觉理解模型

  # 通义千问配置 (预留，暂未完全实现)
  tongyi:
    api_key: sk-af3f441d4a1343bfabe5a6395ecacc91
    api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen-plus
    vision_model: qwen3-vl-plus

  # 通用 LLM 参数
  temperature: 0.7  # 温度参数，控制随机性 (0-1)
  max_tokens: 2000  # 最大生成 token 数
  timeout: 60  # 请求超时时间（秒）


redis:
  url: "redis://localhost:6379/2"
  max_connections: 10
  password: root


chat:
  # 短期记忆过期时间，默认 2 小时
  checkpoint_expire: 2


# RAG 存储配置 - PostgreSQL DocStore & IndexStore
rag:
  storage:
    postgres:
      # 文档存储 (DocStore)
      docstore:
        host: localhost
        port: 15432
        database: shopmind_rag
        user: postgres
        password: hcy991002
        table_name: platform_rule_docs
        schema_name: public
        perform_setup: true   # 首次启动时自动建表
        debug: false
        use_jsonb: true       # 强烈建议开启：使用 JSONB 类型提升查询性能

      # 索引元数据存储 (IndexStore) - 虽 VectorStoreIndex 不强制需要，但保留以备扩展
      indexstore:
        host: localhost
        port: 15432
        database: shopmind_rag
        user: postgres
        password: hcy991002
        table_name: platform_rule_indices
        schema_name: public
        perform_setup: true
        debug: false
        use_jsonb: true

    # 向量存储 (Milvus) - 注意，维度由 embedding service 配置项进行提供，不可自定义
    milvus:
      host: localhost
      port: 19530
      token: root:Milvus
      # 不存在，则创建
      db_name: platform_rules
      collection_name: platform_rules_collection
      similarity_metric: COSINE
      index_type: HNSW
      HNSW:
        params_M: 8
        params_efConstruction: 100
